<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="for you ♡">
<meta property="og:description" content="something little, made just for you">
</head>
<body>
<title>A Bouquet for You</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: one full-screen night garden; the note sits at the top, the bouquet fills the rest, two quiet controls in the bottom corners */
:root{
  --night:#0b0a1c;
  --ink:#fbe9ef;
  --ink-soft:#d8bccb;
  --rose:#ff8fab;
  --paper:#f4dbe0;
  --paper-deep:#c98d9d;
  --seal:#a3123a;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink)}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

#msg{position:fixed;top:0;left:0;right:0;z-index:2;pointer-events:none;text-align:center;font-family:var(--hand);
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#msg .l1{font-size:clamp(34px,9vw,50px);font-weight:700;color:var(--rose);line-height:1.1;text-shadow:0 0 18px rgba(255,120,160,.35)}
#msg .ln{font-size:clamp(22px,5.6vw,31px);font-weight:500;line-height:1.25;max-width:30ch;margin-inline:auto;text-wrap:balance}
#msg .ch{opacity:0;transition:opacity .4s ease}
#msg .ch.on{opacity:1}

#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity 1s ease,transform 1s ease}
#intro.gone{opacity:0;transform:scale(1.05);pointer-events:none}
#env{position:relative;width:min(280px,74vw);aspect-ratio:28/18;max-width:100%;border:0;padding:0;background:none;cursor:pointer;
  perspective:900px;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(255,110,150,.18))}
#env:focus-visible{outline:2px dashed var(--rose);outline-offset:12px;border-radius:8px}
.e-back{position:absolute;inset:0;background:var(--paper-deep);border-radius:7px}
.e-letter{position:absolute;left:7%;right:7%;top:7%;bottom:8%;z-index:1;background:#fff8f9;border-radius:4px;
  display:flex;justify-content:center;padding-top:9%;font-family:var(--hand);font-size:28px;font-weight:700;color:var(--seal);
  transition:transform 1s cubic-bezier(.2,.8,.2,1) .5s}
.e-front{position:absolute;inset:0;z-index:2;border-radius:7px;background:linear-gradient(180deg,#f6dfe4,#e7b8c3);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.e-flap{position:absolute;left:0;right:0;top:0;height:62%;z-index:3;background:linear-gradient(180deg,#fae7eb,#e9bdc7);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;transition:transform .75s ease,z-index 0s linear .38s}
.seal{position:absolute;left:50%;top:62%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:4;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8507a,#a3123a 58%,#6f0a28);color:#ffd5df;display:grid;place-items:center;
  font-size:21px;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .35s ease,transform .35s ease}
#env.open{animation:none}
#env.open .e-flap{transform:rotateX(180deg);z-index:0}
#env.open .seal{opacity:0;transform:scale(.5)}
#env.open .e-letter{transform:translateY(-58%)}
.i-line{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(21px,5.4vw,27px);color:var(--ink);text-align:center;text-wrap:balance}
.i-hint{margin:0;font-family:var(--hand);font-size:21px;color:var(--rose);animation:pulse 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

.ctl{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,190,210,.28);background:rgba(22,12,38,.55);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .7s ease}
.ctl.show{opacity:1;pointer-events:auto}
.ctl:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.ctl svg{width:20px;height:20px}
#mute{right:max(14px,env(safe-area-inset-right,0px))}
#replay{left:max(14px,env(safe-area-inset-left,0px))}
#mute .off{display:none}
#mute[aria-pressed="true"] .on{display:none}
#mute[aria-pressed="true"] .off{display:block}
#hint{position:fixed;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;pointer-events:none;
  font-family:var(--hand);font-size:21px;color:var(--ink-soft);opacity:0;transition:opacity 1.2s ease}
#hint.show{opacity:1}
@media (prefers-reduced-motion: reduce){#env,.i-hint{animation:none}}
</style>

<canvas id="scene" aria-label="A bouquet of roses, peonies, tulips, daisies and lavender blooming under a starry sky"></canvas>
<div id="msg" aria-live="polite"></div>

<div id="intro">
  <button id="env" type="button" aria-label="Open the envelope">
    <span class="e-back"></span>
    <span class="e-letter">for nica ♡</span>
    <span class="e-front"></span>
    <span class="e-flap"></span>
    <span class="seal">♥</span>
  </button>
  <p class="i-line">something little, made just for you</p>
  <p class="i-hint">tap the envelope</p>
</div>

<audio id="song" src="song.mp3" preload="auto" loop playsinline></audio>
<p id="hint">tap anywhere ♡</p>
<button id="replay" class="ctl" type="button" aria-label="Watch it bloom again">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
</button>
<button id="mute" class="ctl" type="button" aria-label="Mute music" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg>
</button>

<script>
(() => {
"use strict";

/* ---------- the note ---------- */
const MESSAGE = [
  "hey nica ♡",
  "i couldn't choose just one flower,",
  "so i grew you a whole bouquet."
];

const cv = document.getElementById("scene");
const ctx = cv.getContext("2d");
const msgEl = document.getElementById("msg");
const intro = document.getElementById("intro");
const env = document.getElementById("env");
const muteBtn = document.getElementById("mute");
const replayBtn = document.getElementById("replay");
const hintEl = document.getElementById("hint");
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { if (x <= 0) return 0; if (x >= 1) return 1; const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = x => 1 - Math.pow(1 - clamp(x), 3);
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1402);

/* ---------- message, revealed letter by letter ---------- */
const chars = [], charT = [];
{
  let t = 0;
  MESSAGE.forEach((line, i) => {
    const d = document.createElement("div");
    d.className = i === 0 ? "l1" : "ln";
    if (i) t += 0.5;
    for (const ch of line) {
      const s = document.createElement("span");
      s.className = "ch"; s.textContent = ch;
      d.appendChild(s); chars.push(s); charT.push(t);
      t += ch === "," ? 0.32 : 0.055;
    }
    msgEl.appendChild(d);
  });
}
const MSG_START = 3.2;
let revealed = -1;
function updateMsg(t){
  const lt = t - MSG_START;
  let n = 0;
  while (n < charT.length && charT[n] <= lt) n++;
  if (n !== revealed) { for (let i = 0; i < chars.length; i++) chars[i].classList.toggle("on", i < n); revealed = n; }
}

/* ---------- palettes ---------- */
const PAL = {
  crimson:["#4a0716","#a5163b","#ee5a7c"],
  pink:   ["#7d1f43","#e06a90","#ffc6d5"],
  blush:  ["#b24c6f","#f4a3ba","#ffe7ed"],
  blush2: ["#9c3f6a","#ec90b2","#ffdbe7"],
  coral:  ["#9e2a2a","#ef6d57","#ffc4a9"],
  coral2: ["#a1335c","#f07a9c","#ffd3df"],
  white:  ["#c4bde6","#f3f0ff","#ffffff"],
  lav:    ["#4f3596","#9a7ae6","#cdbbff"]
};

/* ---------- the bouquet (logical space 400 x 720) ---------- */
const DEF = [
  ["rose",  200,300,44,"crimson"],
  ["peony", 136,348,40,"blush"],
  ["peony", 266,342,40,"blush2"],
  ["rose",  200,394,34,"pink"],
  ["rose",  158,236,33,"pink"],
  ["rose",  246,232,35,"crimson"],
  ["tulip", 200,178,34,"coral"],
  ["daisy",  92,290,30,"white"],
  ["daisy", 308,282,30,"white"],
  ["tulip", 118,198,30,"coral2"],
  ["tulip", 286,188,30,"coral"],
  ["rose",  146,430,27,"crimson"],
  ["daisy", 254,432,24,"white"],
  ["lav",    66,214,0,"lav"],
  ["lav",   336,204,0,"lav"],
  ["lav",   104,150,0,"lav"],
  ["lav",   302,138,0,"lav"],
  ["breath", 82,376,0,"white"],
  ["breath",322,372,0,"white"],
  ["breath",206,126,0,"white"],
  ["breath",148,160,0,"white"],
  ["breath",258,150,0,"white"]
];
const flowers = DEF.map((d, i) => {
  const f = {
    kind:d[0], x:d[1], y:d[2], r:d[3], pal:PAL[d[4]],
    delay:0.55 + i * 0.15,
    rot:R() * TAU, tilt:(R() - 0.5) * 0.5, squash:0.82 + R() * 0.14, ph:R() * TAU,
    bx:200 + (d[1] - 200) * 0.1 + (R() - 0.5) * 6, by:612,
    leaf: i < 13 && R() < 0.7 ? (d[1] < 200 ? -1 : 1) : 0,
    G:{hx:0,hy:0,cx:0,cy:0}
  };
  if (f.kind === "breath") {
    f.branches = [];
    for (let b = 0; b < 5; b++) {
      const a = -Math.PI / 2 + (b - 2) * 0.5 + (R() - 0.5) * 0.3, len = 10 + R() * 12;
      const dots = [];
      const nd = 4 + (R() * 3 | 0);
      for (let k = 0; k < nd; k++) dots.push({ x:(R() - 0.5) * 11, y:(R() - 0.5) * 9, r:1.3 + R() * 1.2 });
      f.branches.push({ dx:Math.cos(a) * len, dy:Math.sin(a) * len, dots });
    }
  }
  return f;
});
const isFiller = f => f.kind === "lav" || f.kind === "breath";
const drawOrder = flowers.slice().sort((a, b) => (isFiller(a) ? 0 : 1) - (isFiller(b) ? 0 : 1) || a.y - b.y);
const sparkles = Array.from({length:18}, () => { const a = R() * TAU, k = Math.sqrt(R()); return { x:200 + Math.cos(a) * 185 * k, y:300 + Math.sin(a) * 200 * k, s:2 + R() * 3.5, ph:R() * TAU, sp:1.2 + R() * 1.8 }; });

/* ---------- canvas sizing ---------- */
let W = 0, H = 0, dpr = 1, S = 1, OX = 0, OY = 0;
let bg = null, stars = [];
const fireflies = [], petals = [], hearts = [];

function layout(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const top = msgEl.getBoundingClientRect().bottom + 8;
  const bottomPad = 64;
  const availH = Math.max(200, H - top - bottomPad);
  S = Math.max(0.3, Math.min(W / 400, availH / 610));
  OX = (W - 400 * S) / 2;
  OY = top - 100 * S + Math.max(0, availH - 610 * S) * 0.45;

  bg = document.createElement("canvas");
  bg.width = cv.width; bg.height = cv.height;
  const b = bg.getContext("2d");
  const g = b.createLinearGradient(0, 0, 0, bg.height);
  g.addColorStop(0, "#08091a"); g.addColorStop(0.55, "#130c27"); g.addColorStop(1, "#261034");
  b.fillStyle = g; b.fillRect(0, 0, bg.width, bg.height);
  const hz = b.createRadialGradient(bg.width / 2, bg.height * 1.05, 0, bg.width / 2, bg.height * 1.05, bg.height * 0.75);
  hz.addColorStop(0, "rgba(120,40,90,0.45)"); hz.addColorStop(1, "rgba(120,40,90,0)");
  b.fillStyle = hz; b.fillRect(0, 0, bg.width, bg.height);

  const n = Math.round(clamp(W * H / 4500, 70, 300));
  stars = Array.from({length:n}, () => ({ x:Math.random() * W, y:Math.random() * H * 0.92, r:0.35 + Math.random() * 1.05, ph:Math.random() * TAU, sp:0.6 + Math.random() * 2 }));

  const nf = reduce ? 10 : Math.round(clamp(W * H / 22000, 14, 40));
  fireflies.length = 0;
  for (let i = 0; i < nf; i++) fireflies.push({ x:Math.random() * W, y:Math.random() * H, vx:(Math.random() - 0.5) * 14, vy:(Math.random() - 0.5) * 14, ph:Math.random() * TAU, s:14 + Math.random() * 16 });
  const np = reduce ? 0 : Math.round(clamp(W / 32, 10, 26));
  petals.length = 0;
  for (let i = 0; i < np; i++) petals.push(newPetal(true));
}
function newPetal(anywhere){
  const cols = ["#ffb3c6","#ff8fab","#ffd6e0","#f7a1c4","#ffe3ea"];
  return { x:Math.random() * W, y:anywhere ? Math.random() * H : -20, vy:18 + Math.random() * 26, sw:12 + Math.random() * 26, ph:Math.random() * TAU,
           rot:Math.random() * TAU, vr:(Math.random() - 0.5) * 1.6, s:6 + Math.random() * 6, col:cols[Math.random() * cols.length | 0] };
}

const glowSprite = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,240,190,1)"); r.addColorStop(0.18, "rgba(255,214,140,0.85)"); r.addColorStop(0.5, "rgba(255,170,120,0.18)"); r.addColorStop(1, "rgba(255,150,120,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c;
})();

/* ---------- shapes ---------- */
function petal(w, l){ ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-w,-l*0.2,-w*1.05,-l*0.95,0,-l); ctx.bezierCurveTo(w*1.05,-l*0.95,w,-l*0.2,0,0); ctx.closePath(); }
function ruffle(w, l){ ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-w,-l*0.25,-w*1.1,-l*0.8,-w*0.55,-l*0.95); ctx.quadraticCurveTo(-w*0.3,-l*1.07,0,-l*0.93); ctx.quadraticCurveTo(w*0.3,-l*1.07,w*0.55,-l*0.95); ctx.bezierCurveTo(w*1.1,-l*0.8,w,-l*0.25,0,0); ctx.closePath(); }
function pointed(w, l){ ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-w,-l*0.15,-w*0.8,-l*0.72,0,-l); ctx.bezierCurveTo(w*0.8,-l*0.72,w,-l*0.15,0,0); ctx.closePath(); }
function leafPath(w, l){ ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(w,-l*0.5,0,-l); ctx.quadraticCurveTo(-w,-l*0.5,0,0); ctx.closePath(); }
function heartPath(s){ ctx.beginPath(); ctx.moveTo(0,s*0.35); ctx.bezierCurveTo(-s*1.2,-s*0.35,-s*0.55,-s*1.15,0,-s*0.45); ctx.bezierCurveTo(s*0.55,-s*1.15,s*1.2,-s*0.35,0,s*0.35); ctx.closePath(); }
function sparkle(x, y, s){ ctx.beginPath(); ctx.moveTo(x,y-s); ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.closePath(); ctx.fill(); }

/* ---------- stems ---------- */
function geom(f, tn){
  const sw = reduce ? 0 : 2.6;
  const G = f.G;
  G.hx = f.x + Math.sin(tn * 0.75 + f.ph) * sw;
  G.hy = f.y + Math.cos(tn * 0.6 + f.ph) * sw * 0.5;
  G.cx = (f.bx + G.hx) / 2 + (G.hx - 200) * 0.2;
  G.cy = (f.by + G.hy) / 2 + 10;
}
function qp(f, u){ const G = f.G, a = 1 - u; return [a*a*f.bx + 2*a*u*G.cx + u*u*G.hx, a*a*f.by + 2*a*u*G.cy + u*u*G.hy]; }
function qd(f, u){ const G = f.G; return [2*(1-u)*(G.cx-f.bx) + 2*u*(G.hx-G.cx), 2*(1-u)*(G.cy-f.by) + 2*u*(G.hy-G.cy)]; }

function drawStem(f, g){
  if (g <= 0) return;
  ctx.beginPath();
  for (let k = 0; k <= 20; k++) { const p = qp(f, g * k / 20); k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.lineCap = "round";
  ctx.lineWidth = f.kind === "breath" ? 1.3 : f.kind === "lav" ? 1.8 : 2.8;
  ctx.strokeStyle = "#2f6a44"; ctx.stroke();
  if (f.leaf && g > 0.5) {
    const u = 0.52, p = qp(f, u), d = qd(f, u), s = easeOutBack(clamp((g - 0.5) / 0.4));
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(Math.atan2(d[1], d[0]) + Math.PI / 2 + f.leaf * 0.85); ctx.scale(s, s);
    const lg = ctx.createLinearGradient(0, 0, 0, -28); lg.addColorStop(0, "#1f5235"); lg.addColorStop(1, "#4f9c66");
    ctx.fillStyle = lg; leafPath(9, 28); ctx.fill();
    ctx.strokeStyle = "rgba(200,255,210,0.25)"; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -24); ctx.stroke();
    ctx.restore();
  }
}

/* ---------- blooms ---------- */
function drawSepals(r, budS, b, rot, pal){
  const len = r * (0.28 + 0.3 * b) * budS;
  if (len <= 0.1) return;
  ctx.fillStyle = "#336f48";
  for (let i = 0; i < 5; i++) { ctx.save(); ctx.rotate(rot + 0.3 + i * TAU / 5); pointed(r * 0.13 * budS, len); ctx.fill(); ctx.restore(); }
  const core = r * 0.2 * budS * (1 - b);
  if (core > 0.2) { ctx.fillStyle = pal[1]; ctx.beginPath(); ctx.arc(0, 0, core, 0, TAU); ctx.fill(); }
}
function drawRose(r, b, pal, rot){
  const L = [[5,1,0.6,0,0.36],[5,0.8,0.55,0.63,0.24],[5,0.6,0.5,0.2,0.12],[4,0.4,0.46,1.1,0]];
  for (const [n, l, w, o, dl] of L) {
    const lb = easeOutBack(clamp((b - dl) / (1 - dl)));
    if (lb <= 0) continue;
    const len = Math.max(0.1, r * l * lb), inner = l < 0.7;
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
    gr.addColorStop(0, pal[0]); gr.addColorStop(inner ? 0.75 : 0.5, pal[1]); gr.addColorStop(1, inner ? pal[1] : pal[2]);
    ctx.fillStyle = gr; ctx.strokeStyle = "rgba(60,0,20,0.28)"; ctx.lineWidth = 0.7;
    for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(rot + o + i * TAU / n); petal(r * w * lb, len); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  const s = clamp(b * 1.5);
  if (s > 0) {
    ctx.strokeStyle = pal[0]; ctx.lineWidth = 1.3; ctx.globalAlpha = 0.75 * s;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.09, rot, rot + 4.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.02, 0, r * 0.18, rot + 2, rot + 5.6); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawPeony(r, b, pal, rot){
  const L = [[9,1,0.5,0,0.3],[8,0.82,0.48,0.35,0.2],[7,0.63,0.46,0.1,0.1],[6,0.43,0.44,0.5,0]];
  for (const [n, l, w, o, dl] of L) {
    const lb = easeOutBack(clamp((b - dl) / (1 - dl)));
    if (lb <= 0) continue;
    const len = Math.max(0.1, r * l * lb);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
    gr.addColorStop(0, pal[0]); gr.addColorStop(0.55, pal[1]); gr.addColorStop(1, pal[2]);
    ctx.fillStyle = gr; ctx.strokeStyle = "rgba(120,30,70,0.22)"; ctx.lineWidth = 0.6;
    for (let i = 0; i < n; i++) { ctx.save(); ctx.rotate(rot + o + i * TAU / n); ruffle(r * w * lb, len); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  const s = clamp((b - 0.5) * 2);
  if (s > 0) {
    ctx.fillStyle = "rgba(255,214,130," + (0.9 * s) + ")";
    for (let i = 0; i < 9; i++) { const a = rot + i * 0.7, rr = r * (0.05 + (i % 3) * 0.04); ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.5, 0, TAU); ctx.fill(); }
  }
}
function drawDaisy(r, b, pal, rot){
  const lb = easeOutBack(b);
  if (lb > 0) {
    const gr = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, Math.max(0.2, r * lb));
    gr.addColorStop(0, pal[0]); gr.addColorStop(0.35, pal[1]); gr.addColorStop(1, pal[2]);
    ctx.fillStyle = gr; ctx.strokeStyle = "rgba(90,80,140,0.28)"; ctx.lineWidth = 0.5;
    for (let i = 0; i < 18; i++) { ctx.save(); ctx.rotate(rot + i * TAU / 18); petal(r * 0.17 * lb, r * lb); ctx.fill(); ctx.stroke(); ctx.restore(); }
  }
  const cr = r * 0.27 * Math.min(1, b * 1.4 + 0.25);
  const cg = ctx.createRadialGradient(-cr * 0.3, -cr * 0.3, 0, 0, 0, cr);
  cg.addColorStop(0, "#ffe68c"); cg.addColorStop(0.7, "#f0a51e"); cg.addColorStop(1, "#b86a10");
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(120,60,0,0.35)";
  for (let i = 0; i < 14; i++) { const a = i * 2.4, rr = cr * 0.75 * Math.sqrt((i + 0.5) / 14); ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, cr * 0.07, 0, TAU); ctx.fill(); }
}
function drawTulip(r, b, budS, pal){
  const open = 0.1 + 0.24 * easeOutCubic(b);
  const len = r * (0.55 + 0.65 * easeOutBack(b)) * budS, w = r * 0.5 * budS;
  if (len < 0.5) return;
  const gr = ctx.createLinearGradient(0, r * 0.15, 0, -len);
  gr.addColorStop(0, pal[0]); gr.addColorStop(0.45, pal[1]); gr.addColorStop(1, pal[2]);
  ctx.strokeStyle = "rgba(60,0,10,0.28)"; ctx.lineWidth = 0.7;
  ctx.fillStyle = "#2f6a44"; ctx.beginPath(); ctx.ellipse(0, r * 0.2 * budS, r * 0.14 * budS, r * 0.08 * budS, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = gr;
  for (const a of [-open, open]) { ctx.save(); ctx.translate(0, r * 0.15 * budS); ctx.rotate(a); pointed(w, len); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.save(); ctx.translate(0, r * 0.17 * budS); pointed(w * 0.95, len * 0.95); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, r * 0.1 * budS); ctx.quadraticCurveTo(-w * 0.15, -len * 0.5, 0, -len * 0.85); ctx.stroke();
}
function drawLav(f, g){
  for (let k = 0; k < 13; k++) {
    const u = 0.6 + k * 0.031;
    if (u > g) break;
    const p = qp(f, u), sz = (1 - k / 15) * 3.3 + 1.1;
    ctx.fillStyle = k % 2 ? f.pal[1] : f.pal[2];
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(p[0] + side * sz * 0.85, p[1], sz, sz * 0.68, side * 0.5, 0, TAU); ctx.fill(); }
  }
}
function drawBreath(f, b){
  const e = easeOutBack(b), G = f.G;
  for (const br of f.branches) {
    const ex = G.hx + br.dx * e, ey = G.hy + br.dy * e;
    ctx.strokeStyle = "#3b7a50"; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(G.hx, G.hy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = "#fffaf4";
    for (const d of br.dots) { ctx.beginPath(); ctx.arc(ex + d.x * e, ey + d.y * e, Math.max(0.01, d.r * e), 0, TAU); ctx.fill(); }
  }
}
function drawHead(f, g, b){
  if (f.kind === "lav") { drawLav(f, g); return; }
  if (f.kind === "breath") { if (b > 0) drawBreath(f, b); return; }
  if (g < 0.55) return;
  const budS = clamp((g - 0.55) / 0.45), G = f.G;
  ctx.save(); ctx.translate(G.hx, G.hy);
  if (f.kind === "tulip") {
    const d = qd(f, 1);
    ctx.rotate(Math.atan2(d[1], d[0]) + Math.PI / 2);
    drawTulip(f.r, b, budS, f.pal);
  } else {
    ctx.rotate(f.tilt); ctx.scale(1, f.squash);
    drawSepals(f.r, budS, b, f.rot, f.pal);
    if (b > 0) {
      if (f.kind === "rose") drawRose(f.r, b, f.pal, f.rot);
      else if (f.kind === "peony") drawPeony(f.r, b, f.pal, f.rot);
      else drawDaisy(f.r, b, f.pal, f.rot);
    }
  }
  ctx.restore();
}

/* ---------- wrapping ---------- */
function drawBackPaper(){
  const g = ctx.createLinearGradient(50, 0, 350, 0);
  g.addColorStop(0, "#9a6273"); g.addColorStop(0.5, "#d4a1af"); g.addColorStop(1, "#8f5868");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(200, 700); ctx.lineTo(46, 454);
  ctx.quadraticCurveTo(88, 410, 128, 440); ctx.quadraticCurveTo(165, 402, 200, 430);
  ctx.quadraticCurveTo(238, 400, 272, 438); ctx.quadraticCurveTo(314, 410, 354, 454); ctx.closePath(); ctx.fill();
}
const FRONT = [[86,492],[112,507],[138,495],[166,511],[200,499],[234,511],[262,495],[288,507],[314,492]];
function drawFrontPaper(){
  const g = ctx.createLinearGradient(86, 0, 314, 0);
  g.addColorStop(0, "#cf98a7"); g.addColorStop(0.45, "#f6dde3"); g.addColorStop(1, "#c3889a");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(FRONT[0][0], FRONT[0][1]);
  for (let i = 1; i < FRONT.length; i++) ctx.lineTo(FRONT[i][0], FRONT[i][1]);
  ctx.lineTo(214, 704); ctx.quadraticCurveTo(200, 712, 186, 704); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(120,50,70,0.22)";
  ctx.beginPath(); ctx.moveTo(138, 495); ctx.lineTo(193, 702); ctx.moveTo(262, 495); ctx.lineTo(207, 702); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.beginPath(); ctx.moveTo(200, 499); ctx.lineTo(200, 706); ctx.stroke();
}
function drawRibbon(){
  const bg = ctx.createLinearGradient(0, 596, 0, 622); bg.addColorStop(0, "#d42a58"); bg.addColorStop(1, "#8e1035");
  ctx.fillStyle = bg; ctx.beginPath();
  ctx.moveTo(138, 597); ctx.quadraticCurveTo(200, 609, 262, 597); ctx.lineTo(259, 611); ctx.quadraticCurveTo(200, 623, 141, 611); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(200, 607);
  ctx.fillStyle = "#9d1239";
  ctx.beginPath(); ctx.moveTo(-4, 2); ctx.lineTo(-28, 62); ctx.lineTo(-19, 55); ctx.lineTo(-13, 66); ctx.lineTo(4, 5); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, 2); ctx.lineTo(26, 60); ctx.lineTo(18, 54); ctx.lineTo(10, 64); ctx.lineTo(-3, 5); ctx.closePath(); ctx.fill();
  for (const side of [-1, 1]) {
    ctx.save(); ctx.rotate(side * 0.35);
    const lg = ctx.createRadialGradient(side * 18, -3, 2, side * 20, 0, 24); lg.addColorStop(0, "#ff5a83"); lg.addColorStop(1, "#a3123a");
    ctx.fillStyle = lg; ctx.beginPath(); ctx.ellipse(side * 21, 0, 21, 11, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#6f0a28"; ctx.beginPath(); ctx.ellipse(side * 17, 0, 9, 3.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#c21d4a"; ctx.beginPath(); ctx.ellipse(0, 0, 7.5, 9, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.ellipse(-2, -3, 2.5, 3.5, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawBouquet(t, tn){
  const paperA = clamp(t / 0.7);
  const full = clamp((t - 2) / 4);
  const glow = ctx.createRadialGradient(200, 330, 10, 200, 330, 280);
  glow.addColorStop(0, "rgba(255,150,185," + (0.26 * full + 0.04) + ")"); glow.addColorStop(1, "rgba(255,150,185,0)");
  ctx.fillStyle = glow; ctx.fillRect(-80, 20, 560, 640);

  ctx.globalAlpha = paperA; drawBackPaper(); ctx.globalAlpha = 1;
  for (const f of flowers) geom(f, tn);
  const st = new Map();
  for (const f of drawOrder) {
    const e = t - f.delay;
    const g = clamp(e / (f.kind === "lav" ? 1.6 : 1.1));
    const b = clamp((e - 1.0) / 1.5);
    st.set(f, [g, b]);
    drawStem(f, g);
  }
  for (const f of drawOrder) { const [g, b] = st.get(f); drawHead(f, g, b); }
  ctx.globalAlpha = paperA; drawFrontPaper(); drawRibbon(); ctx.globalAlpha = 1;

  if (full > 0) {
    ctx.globalCompositeOperation = "lighter";
    for (const s of sparkles) {
      const a = Math.pow(0.5 + 0.5 * Math.sin(tn * s.sp + s.ph), 3) * full;
      if (a < 0.02) continue;
      ctx.fillStyle = "rgba(255,236,200," + a + ")";
      sparkle(s.x, s.y, s.s * (0.6 + a * 0.6));
    }
    ctx.globalCompositeOperation = "source-over";
  }
}

/* ---------- ambient particles ---------- */
function drawStars(tn){
  ctx.fillStyle = "#fff";
  for (const s of stars) {
    ctx.globalAlpha = 0.2 + 0.8 * Math.pow(0.5 + 0.5 * Math.sin(tn * s.sp + s.ph), 2);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFireflies(tn, dt){
  ctx.globalCompositeOperation = "lighter";
  for (const f of fireflies) {
    f.vx += (Math.random() - 0.5) * 30 * dt; f.vy += (Math.random() - 0.5) * 30 * dt;
    const sp = Math.hypot(f.vx, f.vy); if (sp > 16) { f.vx *= 16 / sp; f.vy *= 16 / sp; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < -20) f.x = W + 20; if (f.x > W + 20) f.x = -20; if (f.y < -20) f.y = H + 20; if (f.y > H + 20) f.y = -20;
    ctx.globalAlpha = 0.15 + 0.85 * Math.pow(0.5 + 0.5 * Math.sin(tn * 1.7 + f.ph), 2);
    ctx.drawImage(glowSprite, f.x - f.s / 2, f.y - f.s / 2, f.s, f.s);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
}
function drawPetals(tn, dt){
  for (const p of petals) {
    p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > H + 24) Object.assign(p, newPetal(false));
    ctx.save(); ctx.translate(p.x + Math.sin(tn * 0.8 + p.ph) * p.sw, p.y); ctx.rotate(p.rot);
    ctx.scale(1, 0.55 + 0.45 * Math.abs(Math.sin(tn * 1.3 + p.ph)));
    ctx.globalAlpha = 0.75; ctx.fillStyle = p.col; petal(p.s * 0.6, p.s); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
const HCOL = ["#ff8fab","#ff5c8a","#ffc2d1","#ff9ec7","#ffd1dc"];
function spawnHeart(x, y, vx, vy, s, life, drift){
  if (hearts.length > 180) hearts.shift();
  hearts.push({ x, y, vx, vy, s, life, age:0, rot:(Math.random() - 0.5) * 0.7, col:HCOL[Math.random() * HCOL.length | 0], drift, ph:Math.random() * TAU });
}
function drawHearts(dt){
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.age += dt;
    if (h.age >= h.life) { hearts.splice(i, 1); continue; }
    h.vx *= Math.pow(0.12, dt); h.vy = h.vy * Math.pow(0.2, dt) - 14 * dt;
    h.x += (h.vx + (h.drift ? Math.sin(h.age * 2.2 + h.ph) * 14 : 0)) * dt; h.y += h.vy * dt;
    const a = Math.min(1, h.age / 0.15) * (1 - Math.pow(h.age / h.life, 2));
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot); ctx.globalAlpha = a;
    ctx.fillStyle = h.col; heartPath(h.s); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- her song ---------- */
const song = document.getElementById("song");
let muted = false, playing = false;
function startAudio(){
  try {
    song.volume = 0.85;
    song.currentTime = 0;
    const p = song.play();
    playing = true;
    if (p && p.catch) p.catch(() => { playing = false; });
  } catch (e) { playing = false; }
}
function setMuted(m){
  muted = m;
  muteBtn.setAttribute("aria-pressed", String(m));
  muteBtn.setAttribute("aria-label", m ? "Play music" : "Mute music");
  song.muted = m;
  if (!m && song.paused) { const p = song.play(); playing = true; if (p && p.catch) p.catch(() => {}); }
}
function chime(){}
document.addEventListener("visibilitychange", () => {
  if (!playing) return;
  if (document.hidden) song.pause();
  else { const p = song.play(); if (p && p.catch) p.catch(() => {}); }
});

/* ---------- flow ---------- */
let started = false, opened = false, T0 = 0, last = performance.now() / 1000, nextAmbient = 0, uiShown = false;

env.addEventListener("click", () => {
  if (opened) return;
  opened = true;
  env.classList.add("open");
  startAudio();
  setTimeout(() => {
    intro.classList.add("gone");
    T0 = performance.now() / 1000; started = true;
    muteBtn.classList.add("show");
    layout();
  }, 1500);
});
muteBtn.addEventListener("click", e => { e.stopPropagation(); setMuted(!muted); });
replayBtn.addEventListener("click", e => {
  e.stopPropagation();
  T0 = performance.now() / 1000; revealed = -1; uiShown = false;
  try { song.currentTime = 0; if (!muted) { const p = song.play(); playing = true; if (p && p.catch) p.catch(() => {}); } } catch (err) {}
  replayBtn.classList.remove("show"); hintEl.classList.remove("show");
});
cv.addEventListener("pointerdown", e => {
  if (!started) return;
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + Math.random() * 0.4, sp = 70 + Math.random() * 90;
    spawnHeart(e.clientX, e.clientY, Math.cos(a) * sp, Math.sin(a) * sp - 30, 5 + Math.random() * 6, 1.4 + Math.random() * 0.8, false);
  }
  chime();
});

function frame(ms){
  const tn = ms / 1000, dt = Math.min(0.05, Math.max(0, tn - last)); last = tn;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  drawStars(tn);
  if (started) {
    const t = tn - T0;
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * OX, dpr * OY);
    drawBouquet(t, tn);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateMsg(t);
    if (t > 6 && tn > nextAmbient && !reduce) {
      nextAmbient = tn + 0.7 + Math.random() * 0.9;
      const lx = 120 + Math.random() * 160, ly = 260 + Math.random() * 160;
      spawnHeart(OX + lx * S, OY + ly * S, 0, -30 - Math.random() * 25, 4 + Math.random() * 5, 3.5 + Math.random() * 2, true);
    }
    if (t > 8.5 && !uiShown) { uiShown = true; hintEl.classList.add("show"); replayBtn.classList.add("show"); }
    if (t > 15 && hintEl.classList.contains("show")) hintEl.classList.remove("show");
  }
  drawFireflies(tn, dt);
  drawPetals(tn, dt);
  drawHearts(dt);
  requestAnimationFrame(frame);
}

layout();
window.addEventListener("resize", layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(frame);
})();
</script>
